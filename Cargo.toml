[package]
name = "llauncher"
version = "0.1.0"
edition = "2024"
authors = ["don"]
description = "Launcher/Desktop environment for Linux ARM64 smartphone form factor"
license = "MIT"
repository = "https://github.com/don/LLauncher"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
