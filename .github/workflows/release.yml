name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ARM64 release
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libgtk-4-dev pkg-config
          rm -rf /var/lib/apt/lists/*

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Package and checksum
        run: |
          mkdir -p dist
          cp target/release/llauncher dist/llauncher
          tar -C dist -czf llauncher-aarch64-unknown-linux-gnu.tar.gz llauncher
          sha256sum llauncher-aarch64-unknown-linux-gnu.tar.gz \
            > llauncher-aarch64-unknown-linux-gnu.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            llauncher-aarch64-unknown-linux-gnu.tar.gz
            llauncher-aarch64-unknown-linux-gnu.tar.gz.sha256
