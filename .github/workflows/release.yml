name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/aarch64-unknown-linux-gnu/release/llauncher

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/llauncher dist/llauncher-aarch64-linux-gnu
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          cd dist && tar -czf llauncher-aarch64-linux-gnu.tar.gz llauncher-aarch64-linux-gnu LICENSE README.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/llauncher-aarch64-linux-gnu
            dist/llauncher-aarch64-linux-gnu.tar.gz
          generate_release_notes: true
